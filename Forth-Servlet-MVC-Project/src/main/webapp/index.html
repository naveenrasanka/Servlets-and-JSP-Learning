<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Second HTML page</title>
</head>
<body bgcolor="#00ffff" style="align-content:center">
<h1>Welcome to Our Second WebApp</h1>
<h2>Registration Form</h2>
<form action="./Register" method="post">
    <table >
        <tr>
            <td>
                <label id="name">User Name :</label>
            </td>
            <td>
                <input type="text" name="name">
            </td>
        </tr>
        <tr>
            <td>
                <label id="email">Enter Email :</label>
            </td>
            <td>
                <input type="text" name="email" >
            </td>
        </tr>
        <tr>
            <td>
                <label id="password">User Password :</label>
            </td>
            <td>
                <input type="password" name="password">
            </td>
        </tr>
        <tr>
            <td>
                <label id="city">User City :</label>
            </td>
            <td>
                <input type="text" name="city">
            </td>
        </tr>
        <tr>

            <td colspan="2" >
                <input type="submit" name="submit" value="SUBMIT">
            </td>
        </tr>
    </table>
</form>

</body>
</html>
